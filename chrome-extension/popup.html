<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BookExport</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
</head>
<body>
    <main>
        <header>
            <img src="icons/icon48.png" width="26" height="26" alt="">
            <h1>BookExport</h1>
        </header>
        <section aria-label="Book download">
            <h2 id="book-title">Download a book</h2>
            <progress id="download-progress" aria-label="EPUB download progress" hidden></progress>
            <p id="status" role="status">Checking this tab…</p>
        </section>
        <button type="button" disabled>Download EPUB</button>
    </main>
</body>
</html>
